services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports: ["8000:8000"]
    volumes:
      - ./data:/srv/data          # datasets partagés avec l'hôte
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports: ["8501:8501"]
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

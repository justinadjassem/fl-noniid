services:
  # Suivi d'expériences. Démarre en premier : l'API attend qu'il soit sain.
  mlflow:
    build:
      context: .
      dockerfile: mlflow/Dockerfile
    # 5000 par défaut, comme prévu au guide, mais surchargeable : ce port est
    # couramment occupé par une autre stack sur un poste de développement.
    #   MLFLOW_PORT=5001 docker compose up
    ports: ["${MLFLOW_PORT:-5000}:5000"]
    volumes:
      - ./mlruns:/mlruns          # base sqlite + artefacts, conservés sur l'hôte
    environment:
      # MLflow 3.x valide l'en-tête Host contre le rebinding DNS et n'accepte
      # par défaut que localhost et les IP privées. L'API l'appelle par son nom
      # de service — `mlflow:5000` — qui n'est ni l'un ni l'autre : sans cette
      # liste, chaque run échoue sur un 403 « Invalid Host header ».
      #
      # La variable REMPLACE la liste par défaut, elle ne s'y ajoute pas :
      # les entrées localhost et IP privées doivent donc être reconduites.
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*,192.168.*,10.*"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports: ["8000:8000"]
    volumes:
      - ./data:/srv/data          # datasets partagés avec l'hôte
    environment:
      # Port INTERNE au réseau compose : inchangé même si MLFLOW_PORT diffère
      # côté hôte. Sans cette variable, le puits est inerte et rien n'est
      # journalisé — c'est le comportement voulu hors Docker.
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports: ["8501:8501"]
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
